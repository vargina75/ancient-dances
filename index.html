                hint: "Вспомни про кавалера, дарящего букет, и размер 4/4."
            },
            {
                question: "Как безошибочно различить Гавот и Бурре при слуховом анализе, если оба танца французские и имеют размер 4/4?",
                answers: ["По длине затакта (у гавота 2 четверти, у бурре 1 четверть)", "По наличию пунктирного ритма", "По стране происхождения"],
                correct: 0,
                hint: "Это главная ловушка! Один из них более прыжковый и имеет меньший затакт."
            },
            {
                question: "Укажите правильный исторический порядок танцев в классической старинной сюите:",
                answers: ["Сарабанда, Аллеманда, Жига, Куранта", "Аллеманда, Куранта, Сарабанда, Жига", "Павана, Гальярда, Менуэт, Жига"],
                correct: 1,
                hint: "Начинается со спокойной немецкой, заканчивается стремительной английской (6/8)."
            },
            {
                question: "Какие два танца составляли раннюю (доклассическую) танцевальную сюиту?",
                answers: ["Менуэт и Гавот", "Сарабанда и Жига", "Павана и Гальярда"],
                correct: 2,
                hint: "Один из них испанский, «павлиний», а второй — смелый и бодрый."
            },
            {
                question: "Какой композитор XX века написал знаменитый «Гавот»?",
                answers: ["С.С. Прокофьев", "И.С. Бах", "М. Равель"],
                correct: 0,
                hint: "Этот композитор также написал музыку к балету «Ромео и Джульетта»."
            },
            {
                question: "Кто из французских композиторов написал знаменитую «Павану на смерть инфанты», вернувшись к строгим формам прошлого?",
                answers: ["Жан-Филипп Рамо", "Франсуа Куперен", "Морис Равель"],
                correct: 2,
                hint: "Композитор XX века, любивший испанские мотивы. Инфанта — дочь испанского короля."
            },
            {
                question: "Какой танец из Оркестровой сюиты №2 си минор И.С. Баха имеет затакт в одну четверть?",
                answers: ["Менуэт", "Бурре", "Гавот"],
                correct: 1,
                hint: "Этот танец подвижный, французский, с затактом в одну четверть."
            },
            {
                question: "Что означает слово «сюита» в переводе с французского языка?",
                answers: ["Ряд, последовательность, череда", "Танец с бубном", "Печальное шествие"],
                correct: 0,
                hint: "Это слово описывает структуру цикла, а не характер одного танца."
            },
            {
                question: "У какого обязательного танца старинной сюиты размер 6/8?",
                answers: ["Куранта", "Жига", "Сарабанда"],
                correct: 1,
                hint: "Это самый стремительный и энергичный танец, родом из Англии."
            }
        ];

        let visitedElements = new Set();
        let timerInterval;
        let seconds = 0;

        function init() { renderElements(); updateProgress(); }

        function renderElements() {
            const grid = document.getElementById('elements-grid');
            grid.innerHTML = '';
            elements.forEach(el => {
                const btn = document.createElement('div');
                btn.className = 'element-btn';
                if (visitedElements.has(el.id)) btn.classList.add('visited');
                btn.innerHTML = `<h3>${el.title}</h3><p>${el.shortDesc}</p>`;
                btn.onclick = () => openCard(el);
                grid.appendChild(btn);
            });
        }

        function openCard(element) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            let imagesHtml = '';
            if (element.content.images && element.content.images.length > 0) {
                element.content.images.forEach(img => {
                    imagesHtml += `<div class="image-container"><img src="${img.url}" alt="${img.caption}"><div class="image-caption">${img.caption}</div></div>`;
                });
            }
            
            let audioHtml = '';
            if (element.content.audio && element.content.audio.length > 0) {
                element.content.audio.forEach(a => {
                    audioHtml += `<div class="audio-container"><div class="audio-title">${a.title}</div><audio controls preload="none"><source src="${a.url}" type="audio/mpeg">Ваш браузер не поддерживает аудио.</audio><div class="audio-caption">${a.caption}</div></div>`;
                });
            }
            
            let examplesHtml = '';
            element.content.examples.forEach(ex => { examplesHtml += `<div class="example-box">🎵 ${ex}</div>`; });
            let errorsHtml = '';
            element.content.errors.forEach(err => { errorsHtml += `<div class="error-box">⚠️ ${err}</div>`; });
            
            content.innerHTML = `
                <h2>${element.title}</h2>
                ${imagesHtml}
                ${audioHtml}
                <h3>Что это такое?</h3>
                <p>${element.content.definition}</p>
                <h3>Примеры и факты</h3>
                ${examplesHtml}
                <h3>Типичные ошибки (Ловушки)</h3>
                ${errorsHtml}
                <button class="close-btn" onclick="closeCard(${element.id})">Понял, запомнил!</button>`;
            modal.style.display = 'block';
            visitedElements.add(element.id);
            updateProgress();
            renderElements();
            checkTestAvailability();
        }

        function closeCard(elementId) {
            document.getElementById('modal').style.display = 'none';
            updateProgress();
            renderElements();
            checkTestAvailability();
        }

        function updateProgress() {
            const progress = visitedElements.size;
            const total = elements.length;
            document.getElementById('progress-text').textContent = `${progress}/${total}`;
            document.getElementById('progress-fill').style.width = `${(progress / total) * 100}%`;
        }

        function checkTestAvailability() {
            if (visitedElements.size === elements.length) {
                document.getElementById('test-btn').disabled = false;
                document.getElementById('test-btn').textContent = "🎯 Пройти итоговый тест";
            }
        }

        document.getElementById('test-btn').onclick = function() {
            document.getElementById('elements-grid').style.display = 'none';
            document.querySelector('.test-btn-container').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            startTimer();
            renderTest();
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timer-value').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function renderTest() {
            const container = document.getElementById('test-container');
            container.innerHTML = '<h2 style="text-align: center; color: #5c3a21; margin-bottom: 30px; font-size: 2.2rem; border-bottom: 2px solid #c9a96e; padding-bottom: 15px;">Итоговый тест: Старинные танцы</h2>';
            testQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                let answersHtml = '';
                q.answers.forEach((ans, ansIndex) => { answersHtml += `<div class="answer-option" onclick="selectAnswer(${index}, ${ansIndex})">${ans}</div>`; });
                questionDiv.innerHTML = `
                    <div class="question-text"><strong>Вопрос ${index + 1}:</strong> ${q.question}</div>
                    <div class="answers">${answersHtml}</div>
                    <button class="hint-btn" onclick="showHint(${index})">💡 Подсказка</button>
                    <div class="hint-text" id="hint-${index}">${q.hint}</div>`;
                container.appendChild(questionDiv);
            });
            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-test-btn';
            submitBtn.textContent = 'Проверить ответы';
            submitBtn.onclick = checkAnswers;
            container.appendChild(submitBtn);
        }

        function selectAnswer(questionIndex, answerIndex) {
            const options = document.querySelectorAll('.question')[questionIndex].querySelectorAll('.answer-option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[answerIndex].classList.add('selected');
            options[answerIndex].dataset.selected = 'true';
        }

        function showHint(index) { document.getElementById(`hint-${index}`).style.display = 'block'; }

        function checkAnswers() {
            clearInterval(timerInterval);
            let correct = 0;
            const total = testQuestions.length;
            let mistakesHtml = '';
            testQuestions.forEach((q, index) => {
                const options = document.querySelectorAll('.question')[index].querySelectorAll('.answer-option');
                let selected = -1;
                options.forEach((opt, optIndex) => { if (opt.dataset.selected === 'true') selected = optIndex; opt.onclick = null; });
                if (selected === q.correct) { correct++; options[selected].classList.add('correct'); }
                else {
                    if (selected !== -1) options[selected].classList.add('incorrect');
                    options[q.correct].classList.add('correct');
                    const userAnswer = selected !== -1 ? q.answers[selected] : "Ответ не выбран";
                    mistakesHtml += `<div style="margin-bottom: 15px; padding: 15px; background: rgba(255, 249, 240, 0.8); border-left: 4px solid #cd5c5c; border-radius: 8px; text-align: left;">
                        <p style="font-weight: 600; margin-bottom: 8px; color: #3a2a1a;">Вопрос ${index + 1}: ${q.question}</p>
                        <p style="color: #cd5c5c; margin-bottom: 4px;">❌ Ваш ответ: ${userAnswer}</p>
                        <p style="color: #6b8e23; font-weight: 600;">✅ Правильный ответ: ${q.answers[q.correct]}</p></div>`;
                }
            });
            setTimeout(() => showResults(correct, total, mistakesHtml), 1500);
        }

        function showResults(correct, total, mistakesHtml) {
            document.getElementById('test-container').style.display = 'none';
            document.getElementById('timer').style.display = 'none';
            const results = document.getElementById('results');
            results.style.display = 'block';
            let mistakesSection = correct < total
                ? `<div style="margin-top: 30px; text-align: left; max-width: 800px; margin-left: auto; margin-right: auto;"><h3 style="font-family: 'Georgia', serif; color: #cd5c5c; font-size: 1.5rem; margin-bottom: 15px; text-align: center;">Разбор ошибок (процесс требует коррекции):</h3>${mistakesHtml}</div>`
                : `<div style="margin-top: 20px; padding: 15px; background: rgba(107, 142, 35, 0.1); border-radius: 10px; color: #6b8e23; font-weight: 600;">🎉 Ошибок нет! Идеальный результат! Процесс и результат усвоены безупречно.</div>`;
            if (correct === total) {
                results.className = 'results success';
                results.innerHTML = `<h2>Отлично!</h2><p>Ты настоящий знаток старинных танцев!</p><p>Правильных ответов: ${correct} из ${total}</p>${mistakesSection}<button class="restart-btn" onclick="restart()" style="margin-top: 25px;">Вернуться к карточкам</button>`;
                createConfetti();
            } else {
                results.className = 'results failure';
                results.innerHTML = `<h2>Почти получилось!</h2><p>Правильных ответов: ${correct} из ${total}</p><p style="font-size: 1rem; font-style: italic; color: #6b5a4a;">Помни: ошибки в размере или затакте считаются существенными. Повтори карточки!</p>${mistakesSection}<button class="restart-btn" onclick="restart()" style="margin-top: 25px;">Вернуться к карточкам</button><button class="restart-btn" onclick="retakeTest()">Пройти тест снова</button>`;
            }
        }

        function createConfetti() {
            const colors = ['#d4a574', '#b8860b', '#6b8e23', '#cd853f', '#8b7355'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        function restart() {
            visitedElements.clear();
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('elements-grid').style.display = 'grid';
            document.querySelector('.test-btn-container').style.display = 'block';
            document.querySelector('.progress-container').style.display = 'block';
            document.getElementById('test-btn').disabled = true;
            document.getElementById('test-btn').textContent = "Пройти тест";
            renderElements();
            updateProgress();
        }

        function retakeTest() {
            seconds = 0;
            document.getElementById('results').style.display = 'none';
            document.getElementById('test-container').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            startTimer();
            renderTest();
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('modal')) {
                document.getElementById('modal').style.display = 'none';
                updateProgress();
                renderElements();
            }
        };

        init();
    </script>
</body>
</html>
